# Syntax check and an offline end-to-end run of the real app on every push and pull request,
# on all three platforms the app is released for.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            run: xvfb-run -a npm run test:e2e
          - name: windows
            os: windows-latest
            run: npm run test:e2e
          - name: macos
            os: macos-latest
            run: npm run test:e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in main.js preload.js lib/*.js renderer/*.js scripts/*.js; do node --check "$f"; done
      - name: End-to-end test
        shell: bash
        run: ${{ matrix.run }}
