# Builds the desktop app for Windows, Linux and macOS.
#
# - Push a tag like v2.0.1  -> builds on all three platforms and attaches the installers to a
#   draft GitHub release named after the tag. Publish the draft when you are happy with it.
# - "Run workflow" button    -> builds without publishing; the installers are attached to the
#   workflow run as artifacts, handy for testing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --win
          - name: linux
            os: ubuntu-latest
            args: --linux
          - name: macos
            os: macos-latest
            args: --mac
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        # bash on every runner: PowerShell mangles electron-builder's dotted flags.
        # The GitHub publish target (owner/repo) comes from "repository" in package.json.
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificates: build unsigned instead of failing while looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach installers to this run (manual builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v5
        with:
          name: GameMapTracker-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error
